name: Daily Weather Anomaly Update

on:
  schedule:
    # Runs daily at 00:30 UTC (6:00 AM IST)
    - cron: '30 0 * * *'
  # Allows you to trigger it manually anytime with a button
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests numpy

      - name: Run Weather Script
        run: |
          python detect_anomalies.py  

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_anomalies.csv  
          git commit -m "Auto-update weather anomalies [skip ci]" || exit 0
          git push
